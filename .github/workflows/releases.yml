name: Releases

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: rm -rf $AGENT_TOOLSDIRECTORY

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Install Rust Toolchain
        run: rustup target add thumbv7neon-linux-androideabi

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./app/src/main/rust"

      - name: CMake Cache
        uses: actions/cache/restore@v5
        with:
          path: app/.cxx
          key: cmake-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GradleEncryptionKey }}
          cache-read-only: true

      - name: Generate Baseline Profile
        run: ./gradlew generateBaselineProfile
          -Pandroid.testoptions.manageddevices.emulator.gpu="swiftshader_indirect"
          -Prelease

      - name: Build
        run: ./gradlew assembleRelease
          -Prelease

      - name: Rename Apks
        run: |
          find app/build/outputs/apk/default/release/ -name "app-default-universal-release.apk" -exec mv {} EhViewer-${{ github.ref_name }}-default-universal.apk \;
          find app/build/outputs/apk/default/release/ -name "app-default-arm64-v8a-release.apk" -exec mv {} EhViewer-${{ github.ref_name }}-default-arm64-v8a.apk \;
          find app/build/outputs/apk/default/release/ -name "app-default-x86_64-release.apk" -exec mv {} EhViewer-${{ github.ref_name }}-default-x86_64.apk \;
          find app/build/outputs/apk/default/release/ -name "app-default-armeabi-v7a-release.apk" -exec mv {} EhViewer-${{ github.ref_name }}-default-armeabi-v7a.apk \;
          find app/build/outputs/mapping/defaultRelease/ -name "mapping.txt" -exec mv {} EhViewer-${{ github.ref_name }}-default-mapping.txt \;
          find app/build/outputs/native-debug-symbols/defaultRelease/ -name "native-debug-symbols.zip" -exec mv {} EhViewer-${{ github.ref_name }}-default-native-debug-symbols.zip \;

          find app/build/outputs/apk/marshmallow/release/ -name "app-marshmallow-universal-release.apk" -exec mv {} EhViewer-${{ github.ref_name }}-marshmallow-universal.apk \;
          find app/build/outputs/apk/marshmallow/release/ -name "app-marshmallow-arm64-v8a-release.apk" -exec mv {} EhViewer-${{ github.ref_name }}-marshmallow-arm64-v8a.apk \;
          find app/build/outputs/apk/marshmallow/release/ -name "app-marshmallow-x86_64-release.apk" -exec mv {} EhViewer-${{ github.ref_name }}-marshmallow-x86_64.apk \;
          find app/build/outputs/apk/marshmallow/release/ -name "app-marshmallow-armeabi-v7a-release.apk" -exec mv {} EhViewer-${{ github.ref_name }}-marshmallow-armeabi-v7a.apk \;
          find app/build/outputs/mapping/marshmallowRelease/ -name "mapping.txt" -exec mv {} EhViewer-${{ github.ref_name }}-marshmallow-mapping.txt \;
          find app/build/outputs/native-debug-symbols/marshmallowRelease/ -name "native-debug-symbols.zip" -exec mv {} EhViewer-${{ github.ref_name }}-marshmallow-native-debug-symbols.zip \;

      - name: Extract Release Notes
        run: |
          sed -n "/## \[${{ github.ref_name }}\]/,/## \[/p" CHANGELOG.md | sed '$d' | sed '1d' > RELEASE_NOTES.md || true

      - name: Releases
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: EhViewer-${{ github.ref_name }}-*
