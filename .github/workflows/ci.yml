name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      # 入库的预编译 .so 必须覆盖 Kotlin 侧声明的全部 external fun，否则运行到该调用即抛
      # UnsatisfiedLinkError。缺失说明 .so 与源码脱钩，需带 -PbuildNative 重编。
      - name: Verify libehviewer.so JNI exports
        run: python3 .github/scripts/verify-native-symbols.py app/src/main/jniLibs/arm64-v8a/libehviewer.so

      # desktopTest 覆盖 :core:{common,data,i18n,shell,ui} 与 :desktop 的全部 JVM 单测
      - name: Unit tests
        run: ./gradlew desktopTest :app:testDefaultDebugUnitTest

      - name: Format check
        run: ./gradlew spotlessCheck
