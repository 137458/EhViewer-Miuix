[package]
name = "ehviewer_rust"
version = "0.0.0"
edition = "2024"

[lib]
# staticlib: Android 链接进 so；cdylib: 桌面 JVM 加载的动态库（ehviewer_rust.dll）
crate-type = ["staticlib", "cdylib"]

[features]
jvm = ["dep:jni", "dep:jni_fn"]
android = ["dep:ndk", "jvm", "ndk/bitmap"]
android-26 = ["android", "ndk/api-level-26"]

[dependencies]
regex-lite = "0.1"
jni = { version = "0.21", optional = true }
jni_fn = { version = "0.1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }
quick-xml = { default-features = false, version = "0.41" }
tl = { git = "https://github.com/FooIbar/tl.git", features = ["simd"] }
log = "0.4"
android_logger = { default-features = false, version = "0.15" }
serde_cbor = "0.11"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
image = { default-features = false, version = "0.25" }
rxing = { version = "0.9", default-features = false, features = ["decoders", "qrcode", "no_character_set_support"] }
ndk = { version = "0.9", optional = true }
# 桌面无系统 webp 库：static vendor 编译；Android 侧 corrosion 仍链接 NDK 系统库，
# sys2 静态库在 Android 上冗余但语义一致（统一 features 是 cargo 的合并规则）
libwebp-sys2 = { git = "https://github.com/FooIbar/libwebp-sys2-rs.git", features = ["1_5", "demux", "extern-types", "static"] }

[dev-dependencies]
reqwest = "0.13"
tokio = { version = "1", features = ["macros"] }

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
